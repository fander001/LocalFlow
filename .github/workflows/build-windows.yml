name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Build Preact interface
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Build LocalFlow
        run: cargo build --release

      - name: Package Windows program
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -LiteralPath target\release\localflow.exe -Destination artifacts\LocalFlow.exe
          Compress-Archive -LiteralPath artifacts\LocalFlow.exe -DestinationPath artifacts\LocalFlow-win-x64.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: LocalFlow-win-x64
          path: artifacts/LocalFlow-win-x64.zip
          if-no-files-found: error
          retention-days: 30
