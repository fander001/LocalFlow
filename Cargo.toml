[package]
name = "localflow"
version = "0.1.0"
edition = "2024"
description = "A lightweight local media feed for Windows"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "query"] }
mime_guess = "2"
natord = "1"
open = "5"
rfd = "0.15"
rust-embed = { version = "8", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = "symbols"
